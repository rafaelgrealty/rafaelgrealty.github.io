<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rafael Gutierrez | Real Estate</title>
  <meta name="theme-color" content="#0b4f93">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;justify-content:center;min-height:100vh}
    .card-wrap{position:relative;width:100%;max-width:900px;margin:0 auto;background:#fff}
    .card-image{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
    .hotspot{
      position:absolute;display:block;z-index:10;border-radius:16px;
      text-decoration:none;background:rgba(255,255,255,0);
      -webkit-tap-highlight-color:transparent;
    }
    .hotspot:focus-visible{outline:3px solid rgba(255,255,255,.95);outline-offset:-4px}

    /* Main buttons */
    .save {left:6.0%;top:64.1%;width:88.0%;height:4.9%}
    .work {left:6.0%;top:69.5%;width:88.0%;height:4.9%}
    .call {left:6.0%;top:74.9%;width:88.0%;height:4.9%}
    .email{left:6.0%;top:80.3%;width:88.0%;height:4.9%}

    /* Social icons */
    .instagram{left:27.0%;top:90.1%;width:7.4%;height:4.6%;border-radius:12px}
    .facebook {left:41.9%;top:90.1%;width:7.4%;height:4.6%;border-radius:12px}
    .linkedin {left:56.8%;top:90.1%;width:7.4%;height:4.6%;border-radius:12px}
    .youtube  {left:71.7%;top:90.1%;width:7.4%;height:4.6%;border-radius:12px}
  </style>
</head>
<body>
  <main class="card-wrap">
    <img class="card-image"
         src="rafael_gutierrez_real_estate_card.png"
         alt="Rafael Gutierrez Real Estate digital business card">

    <a class="hotspot save"
       href="rafael-gutierrez.vcf"
       aria-label="Save Rafael Gutierrez contact"></a>

    <a class="hotspot work"
       href="tel:+14242626008"
       aria-label="Call work number 424-262-6008"></a>

    <a class="hotspot call"
       href="tel:+16236940386"
       aria-label="Call 623-694-0386"></a>

    <a class="hotspot email"
       href="mailto:rafael@rafaelgrealty.com"
       aria-label="Email Rafael Gutierrez"></a>

    <a class="hotspot instagram"
       href="https://www.instagram.com/rafaelrealestatepro"
       target="_blank" rel="noopener noreferrer"
       aria-label="Instagram"></a>

    <a class="hotspot facebook"
       href="https://www.facebook.com/profile.php?id=61567725307381"
       target="_blank" rel="noopener noreferrer"
       aria-label="Facebook"></a>

    <a class="hotspot linkedin"
       href="https://www.linkedin.com/in/rafaelrealestatepro"
       target="_blank" rel="noopener noreferrer"
       aria-label="LinkedIn"></a>

    <a class="hotspot youtube"
       href="https://youtube.com/@rafaelgrealty"
       target="_blank" rel="noopener noreferrer"
       aria-label="YouTube"></a>
  </main>
</body>
</html>
